<!DOCTYPE html>
<html>
<head>
<title>Forever With You 💍</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  text-align: center;
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 80px;
  font-size: 50px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to { text-shadow: 0 0 30px #ff0066; }
}

p {
  font-size: 22px;
  margin: 30px;
}

.heart {
  font-size: 60px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  margin: 15px;
  cursor: pointer;
  background: white;
  color: #ff0066;
  transition: 0.3s;
}

button:hover {
  background: #ff0066;
  color: white;
}

</style>
</head>

<body>

<h1>Forever With You 💍</h1>

<div class="heart">❤️</div>

<p>
From the moment you came into my life,  
everything became more beautiful.  
I don’t just want today with you…  
I want every tomorrow too.
</p>

<p style="font-size:26px; font-weight:bold;">
Will you stay with me forever, Ankita?
</p>

<button onclick="alert('YAYYY 💖 Forever Starts Now!')">YES 💕</button>
<button onclick="alert('Obviously Forever 😌')">Always 😜</button>

</body>
</html>
